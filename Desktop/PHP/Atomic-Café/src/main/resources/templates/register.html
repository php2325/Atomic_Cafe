<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Atomic Café</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="login-container">
            <div class="login-branding">
                <div class="branding-content">
                    <div class="logo-large">
                        <i class="fas fa-atom"></i>
                    </div>
                    <h1>Atomic Café</h1>
                    <p>Crie sua conta e aproveite momentos especiais com café premium</p>
                    <div class="branding-features">
                        <div class="feature">
                            <i class="fas fa-crown"></i>
                            <span>Vantagens exclusivas</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-gift"></i>
                            <span>Promoções e ofertas</span>
                        </div>
                        <div class="feature">
                            <i class="fas fa-mug-hot"></i>
                            <span>Seu café favorito sempre</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="login-form-container">
                <div class="form-wrapper">
                    <div class="form-header">
                        <h2>Crie sua Conta</h2>
                        <p>Preencha os dados para se cadastrar</p>
                    </div>

                    <form class="login-form" id="registerForm">
                        <div class="form-group">
                            <label for="name" class="form-label">
                                <i class="fas fa-user"></i>
                                Nome completo
                            </label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="Seu nome completo" required>
                            <span class="error-message" id="nameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i>
                                Email
                            </label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="seu.email@example.com" required>
                            <span class="error-message" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i>
                                Senha
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="password" name="password" class="form-input" placeholder="Crie uma senha" required>
                                <button type="button" class="toggle-password" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">
                                <i class="fas fa-lock"></i>
                                Confirmar senha
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirme sua senha" required>
                                <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" id="confirmPasswordError"></span>
                        </div>

                        <button type="submit" class="btn btn-login">
                            <span>Criar conta</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>

                        <div class="alert alert-error" id="formError" style="display: none;"></div>
                    </form>

                    <div class="divider">
                        <span>Já tem uma conta?</span>
                    </div>

                    <div class="signup-link">
                        <p><a href="Login.html">Fazer login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-home">
        <i class="fas fa-home"></i>
        <span>Voltar ao Site</span>
    </a>

    <script src="static/js/script.js"></script>
</body>
</html>
