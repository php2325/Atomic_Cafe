<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Atomic Café</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="login-container">
        <!-- LEFT SIDE - BRANDING -->
        <div class="login-branding">
            <div class="branding-content">
                <div class="logo-large">
                    <i class="fas fa-atom"></i>
                </div>
                <h1>Atomic Café</h1>
                <p>Energize seu dia com o melhor café artesanal</p>
                <div class="branding-features">
                    <div class="feature">
                        <i class="fas fa-coffee"></i>
                        <span>Café Premium</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-users"></i>
                        <span>Comunidade</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-star"></i>
                        <span>Experiência</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE - LOGIN FORM -->
        <div class="login-form-container">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Bem-vindo de Volta!</h2>
                    <p>Faça login para acessar sua conta</p>
                </div>

                <form class="login-form" id="loginForm">
                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            Email
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="seu.email@example.com"
                            required
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            Senha
                        </label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-input" 
                                placeholder="Digite sua senha"
                                required
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                id="togglePassword"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember" id="remember">
                            <span>Lembrar-me</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-link">Esqueceu a senha?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-login">
                        <span>Entrar</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <!-- Error Message -->
                    <div class="alert alert-error" id="formError" style="display: none;"></div>
                </form>

                <!-- Social Login -->
                <div class="divider">
                    <span>Ou continue com</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn social-google">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn social-facebook">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>

                <!-- Sign Up Link -->
                <div class="signup-link">
                    <p>Não tem uma conta? <a href="register.html">Cadastre-se agora</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- BACK TO HOME BUTTON -->
    <a href="index.html" class="back-home">
        <i class="fas fa-home"></i>
        <span>Voltar ao Site</span>
    </a>

    <script src="static/js/script.js"></script>
</body>
</html>
